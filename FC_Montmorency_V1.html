<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>FC Montmorency Seniors</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#070707,#0b0b0b);position:relative}.hidden{display:none!important}.login{min-height:100vh;padding:42px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 20%,#2b0005,#050505 50%)}.crest{width:100px;height:100px;border:3px solid #e50920;border-radius:28px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:28px;box-shadow:0 0 28px #e5092038;margin-bottom:18px}.login h1{font-size:25px;margin:0}.red{color:#ff2038}.sub{color:#aaa;margin:6px 0 30px}.choice{width:100%;display:grid;gap:12px}.btn{border:1px solid #e50920;background:#e50920;color:white;border-radius:13px;padding:15px;font-weight:800}.btn.alt{background:#0b0b0b;border-color:#e50920}.panel{background:#0e0e0e;border:1px solid #242424;border-radius:15px;padding:16px;margin:12px 0}.code{display:flex;gap:9px;justify-content:center;margin:15px 0}.code input{width:54px;height:58px;text-align:center;background:#0b0b0b;border:1px solid #555;color:#fff;border-radius:10px;font-size:24px}.top{padding:18px 17px 8px;display:flex;justify-content:space-between;align-items:center}.top strong{font-size:18px}.content{padding:8px 16px 88px}.hero{background:linear-gradient(120deg,#180005,#101010);border:1px solid #3a1116;border-radius:17px;padding:18px;margin:8px 0 14px}.hero h2{margin:4px 0}.muted{color:#aaa;font-size:13px}.card{background:#101010;border:1px solid #292929;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{padding:4px 8px;border-radius:99px;background:#270006;color:#ff3a4d;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#101010;border:1px solid #262626;border-radius:13px;padding:13px}.stat b{display:block;font-size:22px;margin-top:4px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:70px;background:#090909;border-top:1px solid #292929;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.nav button{background:none;border:0;color:#888;font-size:10px}.nav button.active{color:#ff2038}.nav span{display:block;font-size:21px;margin-bottom:3px}.list{display:grid;gap:7px}.player{display:flex;align-items:center;gap:11px;background:#101010;border:1px solid #242424;border-radius:12px;padding:11px}.num{width:32px;height:32px;border-radius:50%;background:#1a1a1a;display:grid;place-items:center;color:#ff3045;font-weight:800}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 5px;border-bottom:1px solid #242424;text-align:left}.table tr.me{background:#220006}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tabs button{background:#101010;border:1px solid #292929;color:#aaa;border-radius:9px;padding:9px 12px;white-space:nowrap}.tabs button.active{background:#270006;color:#ff3045;border-color:#e50920}.field{margin:10px 0}.field label{display:block;color:#aaa;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:10px;padding:11px}.danger{color:#ff4658}.success{color:#4fe18c}.small{font-size:12px}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#e50920;color:white;padding:11px 15px;border-radius:12px;z-index:20;box-shadow:0 5px 20px #000;max-width:90%}
</style></head><body><div class="app" id="app"></div><script>
const players=[['01','Alpha Diallo','Gardien',0,0,0,0],['02','Lucas Moreira','Défenseur',1,2,1,0],['03','Samir Benali','Défenseur',4,2,5,0],['04','Kévin Martin','Défenseur',5,1,4,0],['05','Rayan El Hadj','Milieu',6,3,3,0],['06','Ibrahim Traoré','Milieu',3,2,2,1],['07','Toons','Milieu',2,4,1,0],['08','Nadir Belkacem','Milieu',3,3,2,0],['09','Léo Morel','Attaquant',2,1,1,0],['10','Sofiane Cherif','Attaquant',1,2,1,0],['11','Thomas Petit','Attaquant',1,1,1,0]];
let state=JSON.parse(localStorage.getItem('fcm_state')||'null')||{role:null,player:null,events:[{type:'match',date:'12/10/2026',time:'15:00',title:'FC Montmorency vs Argenteuil FC',place:'Stade de Montmorency'},{type:'training',date:'15/10/2026',time:'19:00',title:'Entraînement',place:'Terrain du Bel-Air'}],convoked:['01','03','04','05','07','08','09','10','11'],notifs:[]};
const save=()=>localStorage.setItem('fcm_state',JSON.stringify(state));
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function login(){app.innerHTML=`<div class="login"><div class="crest">FCM</div><h1>FC MONTMORENCY</h1><div class="sub">SENIORS • Gestion d'équipe</div><div class="choice"><button class="btn" onclick="showCode('coach')">👤 Connexion Coach<br><span class="small">Code à 4 chiffres</span></button><button class="btn alt" onclick="showCode('player')">⚽ Connexion Joueur<br><span class="small">Code individuel à 2 chiffres</span></button></div><p class="muted small" style="margin-top:22px;text-align:center">Les joueurs n'ont aucun compte et ne peuvent pas modifier les données.</p></div>`}
function showCode(role){let n=role==='coach'?4:2;app.innerHTML=`<div class="login"><div class="crest">FCM</div><h2>${role==='coach'?'Connexion Coach':'Connexion Joueur'}</h2><p class="muted">Entrez votre code à ${n} chiffres</p><div class="code">${Array.from({length:n},(_,i)=>`<input id="c${i}" maxlength="1" inputmode="numeric" oninput="nextCode(${i},${n})">`).join('')}</div><button class="btn" onclick="validateCode('${role}',${n})">Se connecter</button><button class="btn alt" style="margin-top:10px" onclick="login()">Retour</button></div>`;setTimeout(()=>document.getElementById('c0').focus(),50)}
function nextCode(i,n){if(document.getElementById('c'+i).value&&i<n-1)document.getElementById('c'+(i+1)).focus()}
function validateCode(role,n){let code=Array.from({length:n},(_,i)=>document.getElementById('c'+i).value).join('');if(role==='coach'&&code==='4827'){state.role='coach';state.player=null;save();home()}else if(role==='player'&&players.some(p=>p[0]===code)){state.role='player';state.player=code;save();home()}else toast('Code incorrect')}
function header(title){return `<div class="top"><strong>FC <span class="red">MONTMORENCY</span></strong><span class="muted">${state.role==='coach'?'COACH':'SENIORS'}</span></div><div class="content"><h2 style="margin:8px 0">${title}</h2>`}
function home(){app.innerHTML=header('Accueil')+`<div class="hero"><div class="muted">${state.role==='player'?'Bonjour, Joueur '+state.player:'Bienvenue dans la gestion seniors'}</div><h2>Ensemble plus forts 🔴</h2></div><div class="card"><div class="row"><b>⚽ Prochain match</b><span class="pill">12/10</span></div><p>FC Montmorency <b>vs</b> Argenteuil FC</p><span class="muted">Dimanche • 15h00 • Stade de Montmorency</span></div><div class="card"><div class="row"><b>🏃 Prochain entraînement</b><span class="pill">15/10</span></div><p>Entraînement collectif</p><span class="muted">19h00 • Terrain du Bel-Air</span></div><div class="card" onclick="page('conv')"><div class="row"><b>📣 Convocation</b><span class="red">›</span></div><p class="small">${state.role==='player'?(state.convoked.includes(state.player)?'Tu es convoqué pour le prochain match.':'Tu n’es pas convoqué pour le prochain match.'):'Gérer les joueurs convoqués'}</p></div><div class="grid2"><div class="stat"><span class="muted">🏆 Classement</span><b>3e</b><span class="muted">16 points</span></div><div class="stat"><span class="muted">⚽ Buteur #1</span><b>Rayan</b><span class="muted">6 buts</span></div></div></div>`+nav('home')}
function nav(active){return `<div class="nav">${[['home','⌂','Accueil'],['cal','▣','Calendrier'],['rank','♜','Classement'],['stats','▥','Stats'],['profile','●','Profil']].map(x=>`<button class="${active===x[0]?'active':''}" onclick="page('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`}
function page(p){if(p==='home')return home();if(p==='cal')return calendar();if(p==='rank')return rank();if(p==='stats')return stats();if(p==='profile')return profile();if(p==='conv')return conv();if(p==='team')return team();if(p==='manage')return manage()}
function calendar(){app.innerHTML=header('Calendrier')+`<div class="tabs"><button class="active">Matchs</button><button>Entraînements</button></div>${state.events.map((e,i)=>`<div class="card"><div class="muted">${e.date} • ${e.time}</div><b>${e.type==='match'?'⚽':'🏃'} ${e.title}</b><div class="muted" style="margin-top:5px">📍 ${e.place}</div>${state.role==='coach'?`<button class="btn alt small" style="margin-top:9px" onclick="delEvent(${i})">Supprimer</button>`:''}</div>`).join('')}${state.role==='coach'?`<button class="btn" onclick="addEvent()">＋ Ajouter un événement</button>`:''}</div>`+nav('cal')}
function rank(){let teams=[['Argenteuil FC',17],['FC Saint-Leu',16],['FC Montmorency',16],['Sarcelles FC',14],['Épinay FC',13],['Goussainville FC',12],['Deuil-Enghien',11],['Persan',8]];app.innerHTML=header('Championnat')+`<div class="tabs"><button class="active">Classement</button><button>Résultats</button></div><div class="panel"><table class="table"><tr><th>#</th><th>Équipe</th><th>J</th><th>Pts</th></tr>${teams.map((t,i)=>`<tr class="${t[0]==='FC Montmorency'?'me':''}"><td>${i+1}</td><td>${t[0]}</td><td>8</td><td>${t[1]}</td></tr>`).join('')}</table></div></div>`+nav('rank')}
function stats(){let sorted=[...players].sort((a,b)=>b[3]-a[3]);app.innerHTML=header('Statistiques')+`<div class="tabs"><button class="active">Buteurs</button><button>Passeurs</button><button>🟨 Jaunes</button><button>🟥 Rouges</button></div><div class="panel"><b>⚽ Meilleurs buteurs</b>${sorted.slice(0,7).map((p,i)=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #222"><span>${i+1}. ${p[1]}</span><b>${p[3]}</b></div>`).join('')}</div><div class="panel"><b>🎯 Meilleurs passeurs</b>${[...players].sort((a,b)=>b[4]-a[4]).slice(0,5).map((p,i)=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #222"><span>${i+1}. ${p[1]}</span><b>${p[4]}</b></div>`).join('')}</div><div class="grid2"><div class="panel"><b>🟨 Jaunes</b>${[...players].sort((a,b)=>b[5]-a[5]).slice(0,4).map(p=>`<div class="row" style="padding:7px 0"><span>${p[1]}</span><b>${p[5]}</b></div>`).join('')}</div><div class="panel"><b>🟥 Rouges</b>${players.filter(p=>p[6]>0).map(p=>`<div class="row" style="padding:7px 0"><span>${p[1]}</span><b>${p[6]}</b></div>`).join('')||'<span class="muted">Aucun</span>'}</div></div></div>`+nav('stats')}
function team(){app.innerHTML=header('Équipe')+`<div class="list">${players.map(p=>`<div class="player"><div class="num">${p[0]}</div><div style="flex:1"><b>${p[1]}</b><div class="muted">${p[2]} • ⚽ ${p[3]} • 🎯 ${p[4]}</div></div>${state.role==='coach'?`<button class="btn alt small" onclick="editPlayer('${p[0]}')">Modifier</button>`:''}</div>`).join('')}</div></div>`+nav('profile')}
function conv(){app.innerHTML=header('Convocations')+`<div class="card"><b>⚽ FC Montmorency vs Argenteuil FC</b><div class="muted" style="margin-top:6px">Dimanche 12 octobre • 15h00 • Stade de Montmorency</div></div><div class="panel"><b>Joueurs convoqués (${state.convoked.length})</b>${players.map(p=>`<div class="row" style="padding:9px 0"><span>${p[0]} — ${p[1]}</span><span class="${state.convoked.includes(p[0])?'success':'muted'}">${state.convoked.includes(p[0])?'✓ Convoqué':'—'}</span></div>`).join('')}</div>${state.role==='coach'?`<button class="btn" onclick="manageConv()">Modifier la convocation</button>`:''}</div>`+nav('cal')}
function profile(){let p=state.player?players.find(x=>x[0]===state.player):null;app.innerHTML=header('Profil')+`${p?`<div class="hero"><div class="muted">Joueur ${p[0]}</div><h2>${p[1]}</h2><div class="muted">${p[2]}</div></div><div class="grid2"><div class="stat">⚽<b>${p[3]}</b><span class="muted">Buts</span></div><div class="stat">🎯<b>${p[4]}</b><span class="muted">Passes</span></div><div class="stat">🟨<b>${p[5]}</b><span class="muted">Jaunes</span></div><div class="stat">🟥<b>${p[6]}</b><span class="muted">Rouges</span></div></div>`:`<div class="panel"><b>👨‍💼 Espace Coach</b><p class="muted">Gestion complète de l'équipe.</p><button class="btn" onclick="page('team')">👥 Gérer les joueurs</button><button class="btn alt" style="margin-top:8px" onclick="page('manage')">⚙️ Outils coach</button></div>`}<button class="btn alt" style="margin-top:15px" onclick="state.role=null;state.player=null;save();login()">Se déconnecter</button></div>`+nav('profile')}
function manage(){app.innerHTML=header('Espace Coach')+`<div class="grid2"><button class="btn" onclick="page('team')">👥<br>Gérer les joueurs</button><button class="btn" onclick="addEvent()">📅<br>Créer un match</button><button class="btn" onclick="addEvent('training')">🏃<br>Créer un entraînement</button><button class="btn" onclick="manageConv()">📣<br>Faire une convocation</button></div><div class="panel"><b>🔔 Notifications</b><p class="muted">Les notifications de cette V1 sont simulées localement. La version publiée pourra utiliser un service push gratuit selon la plateforme choisie.</p></div></div>`+nav('profile')}
function addEvent(force){let type=force||prompt('Type : match ou training','match');if(!['match','training'].includes(type))return;let title=type==='match'?prompt('Adversaire / intitulé','FC Montmorency vs Nouvel adversaire'): 'Entraînement';let date=prompt('Date (JJ/MM/AAAA)','19/10/2026');let time=prompt('Heure','15:00');let place=prompt('Lieu','Stade de Montmorency');if(!title||!date||!time||!place)return;state.events.push({type,title,date,time,place});save();toast('Événement ajouté');calendar()}
function delEvent(i){if(confirm('Supprimer cet événement ?')){state.events.splice(i,1);save();calendar()}}
function manageConv(){let selected=[...state.convoked];app.innerHTML=header('Modifier la convocation')+`<div class="panel"><b>Sélectionne les joueurs</b>${players.map(p=>`<label style="display:block;padding:10px 0;border-bottom:1px solid #222"><input type="checkbox" ${selected.includes(p[0])?'checked':''} value="${p[0]}" style="accent-color:#e50920"> ${p[0]} — ${p[1]}</label>`).join('')}</div><button class="btn" onclick="saveConv()">Enregistrer et envoyer</button></div>`+nav('cal')}
function saveConv(){state.convoked=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);state.notifs.push({text:'Nouvelle convocation pour le prochain match',date:new Date().toLocaleString('fr-FR')});save();toast('Convocation enregistrée');conv()}
function editPlayer(id){let p=players.find(x=>x[0]===id);let goals=prompt('Buts',p[3]);let assists=prompt('Passes',p[4]);let yellow=prompt('Cartons jaunes',p[5]);let red=prompt('Cartons rouges',p[6]);if([goals,assists,yellow,red].some(x=>x===null))return;p[3]=+goals;p[4]=+assists;p[5]=+yellow;p[6]=+red;toast('Statistiques modifiées (prototype)');team()}
login();
</script></body></html>
